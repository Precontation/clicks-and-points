name: Build Godot project for all platforms

on:
  workflow_dispatch:

env:
  GODOT_VERSION: ${{ vars.GODOT_VERSION }}
  EXPORT_NAME: clicks-and-points
  REPO_TO_CLONE: Precontation/clicks-and-points-source
  PROJECT_PATH: source

jobs:
  export:
    name: Export (${{ matrix.platform }})
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:${{ vars.GODOT_VERSION }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            export_preset: Windows Desktop
            artifact_name: Clicks & Points.exe

          - platform: linux
            export_preset: Linux
            artifact_name: Clicks & Points.x86_64

          - platform: web
            export_preset: Web
            artifact_name: index.html

          - platform: android
            export_preset: Android
            artifact_name: Clicks & Points.apk

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y fontconfig

      - name: Checkout private source repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPO_TO_CLONE }}
          token: ${{ secrets.DEPLOY_TOKEN }}
          lfs: true
          path: source
          fetch-depth: 1

      - name: Cache Godot import folder
        uses: actions/cache@v6
        with:
          path: source/.godot/
          key: >-
            v2-${{ runner.os }}-${{ matrix.platform }}-godot-${{
            vars.GODOT_VERSION }}-${{
            hashFiles(
              'source/project.godot',
              'source/export_presets.cfg',
              'source/**/*.gd',
              'source/**/*.tres',
              'source/**/*.tscn',
              'source/**/*.import'
            ) }}

      - name: Setup Godot
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$HOME/.config/godot"
      
          cp -r \
            "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/." \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      
          cp -r \
            "/root/.config/godot/." \
            "$HOME/.config/godot/"

      - name: Setup Android SDK
        if: matrix.platform == 'android'
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Setup Android release keystore
        if: matrix.platform == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          chmod 600 /tmp/release.keystore

      - name: Import project
        working-directory: source
        run: |
          godot --headless --editor --quit

      - name: Build
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_RELEASE_KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "build/${{ matrix.platform }}"
          cd "$PROJECT_PATH"

          if [ "${{ matrix.platform }}" = "web" ]; then
            OUTPUT_NAME="clicks-and-points-${{ github.run_id }}.html"
          else
            OUTPUT_NAME="${{ matrix.artifact_name }}"
          fi

          godot \
            --headless \
            --verbose \
            --export-release \
            "${{ matrix.export_preset }}" \
            "../build/${{ matrix.platform }}/${OUTPUT_NAME}"

          if [ "${{ matrix.platform }}" = "web" ]; then
            cp \
              "../build/web/clicks-and-points-${{ github.run_id }}.html" \
              "../build/web/index.html"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: build/${{ matrix.platform }}
          if-no-files-found: error

  export-mac:
    name: Export (mac)
    runs-on: macos-26

    steps:
      - name: Checkout private source repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPO_TO_CLONE }}
          token: ${{ secrets.DEPLOY_TOKEN }}
          lfs: true
          path: source
          fetch-depth: 1

      - name: Cache Godot import folder
        uses: actions/cache@v6
        with:
          path: source/.godot/
          key: >-
            v2-${{ runner.os }}-mac-godot-${{
            vars.GODOT_VERSION }}-${{
            hashFiles(
              'source/project.godot',
              'source/export_presets.cfg',
              'source/**/*.gd',
              'source/**/*.tres',
              'source/**/*.tscn',
              'source/**/*.import'
            ) }}

      - name: Setup Godot
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          mkdir -p "$RUNNER_TEMP/bin"

          curl -fL \
            "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=macos.universal.zip&platform=macos.universal" \
            -o "$RUNNER_TEMP/godot.zip"

          ditto -x -k "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/godot"

          ln -s \
            "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" \
            "$RUNNER_TEMP/bin/godot"

          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Setup export templates
        run: |
          curl -fL \
            "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=export_templates.tpz&platform=templates" \
            -o "$RUNNER_TEMP/templates.tpz"

          mkdir -p "$RUNNER_TEMP/templates"
          ditto -x -k "$RUNNER_TEMP/templates.tpz" "$RUNNER_TEMP/templates"

          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"

          mkdir -p "$TEMPLATE_DIR"
          cp -R "$RUNNER_TEMP/templates/templates/." "$TEMPLATE_DIR/"

      - name: Setup actool
        run: |
          ACTOOL_PATH="$(xcrun --find actool)"

          ln -s "$ACTOOL_PATH" "$RUNNER_TEMP/bin/actool"

          godot --version
          actool --version

      - name: Import project
        working-directory: source
        run: |
          godot --headless --editor --quit

      - name: Build Mac
        run: |
          mkdir -p build/mac
          cd "$PROJECT_PATH"

          godot \
            --headless \
            --verbose \
            --export-release \
            "macOS" \
            "../build/mac/Clicks & Points.app"

      - name: Create certificate file
        run: |
          echo '${{ secrets.MACOS_CERT_P12_BASE64 }}' \
            | base64 -D > cert.p12

      - name: Write App Store Connect key
        run: |
          cat > app_store_connect_key.json <<'EOF'
          ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
          EOF

      - name: Sign and notarize
        uses: indygreg/apple-code-sign-action@v1
        with:
          input_path: build/mac/Clicks & Points.app
          notarize: true
          staple: true
          p12_file: cert.p12
          p12_password: ${{ secrets.CERT_PASSWORD }}
          app_store_connect_api_key_json_file: app_store_connect_key.json
          sign_args: --code-signature-flags=runtime

      - name: Package Mac app
        run: |
          cd build/mac
          zip -qry "mac.zip" "Clicks & Points.app"

      - name: Upload Mac artifact
        uses: actions/upload-artifact@v7
        with:
          path: build/mac/mac.zip
          archive: false
          if-no-files-found: error

  deploy-web:
    name: Deploy Web to GitHub Pages
    runs-on: ubuntu-24.04
    needs: export

    permissions:
      contents: write

    steps:
      - name: Checkout public repo
        uses: actions/checkout@v7

      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: web
          path: build/web

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/web
          clean: true
