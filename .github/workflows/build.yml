name: Build Godot project for all platforms
on: workflow_dispatch

env:
  GODOT_VERSION: 4.6.2
  EXPORT_NAME: clicks-and-points
  REPO_TO_CLONE: Precontation/clicks-and-points-source
  PROJECT_PATH: source

jobs:
  export:
    name: Export (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            export_preset: "Windows Desktop"
            artifact_name: "clicks-and-points.exe"
          - platform: mac-unsigned
            export_preset: "macOS"
            artifact_name: "clicks-and-points-mac-unsigned.zip"
          - platform: linux
            export_preset: "Linux"
            artifact_name: "clicks-and-points.x86_64"
          - platform: web
            export_preset: "Web"
            artifact_name: "index.html"

    steps:
      - name: Install dependencies (Mac only)
        if: matrix.platform == 'mac-unsigned'
        run: apt-get update && apt-get install -y fontconfig

      - name: Checkout private source repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_TO_CLONE }}
          token: ${{ secrets.DEPLOY_TOKEN }}
          lfs: true
          path: source
          fetch-depth: 1

      - name: Cache Godot import folder
        uses: actions/cache@v4
        with:
          path: source/.godot/
          key: ${{ runner.os }}-godot-${{ env.GODOT_VERSION }}-${{ hashFiles('source/project.godot') }}
          restore-keys: |
            ${{ runner.os }}-godot-${{ env.GODOT_VERSION }}-

      - name: Setup Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Build
        run: |
          mkdir -p build/${{ matrix.platform }}
          cd "$PROJECT_PATH"
          godot --headless --verbose --export-release "${{ matrix.export_preset }}" "../build/${{ matrix.platform }}/${{ matrix.artifact_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: build/${{ matrix.platform }}

  mac-sign:
    name: Build & Sign macOS
    runs-on: macos-latest
    needs: export
    env:
      CERT_P12: ${{ secrets.CERT_P12 }}
      SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
      CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
      AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
      AC_TEAMID: ${{ secrets.AC_TEAMID }}
      AC_USERNAME: ${{ secrets.AC_USERNAME }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download mac artifact
        uses: actions/download-artifact@v4
        with:
          name: mac-unsigned
          path: build/mac

      - name: Import certificate
        run: |
          echo "$CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s build.keychain login.keychain-db
          security default-keychain -d user -s build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      - name: Unzip mac artifact
        run: unzip build/mac/*.zip -d build/mac

      - name: Codesign
        run: |
          codesign --force --deep --options runtime \
            --sign "$SIGN_IDENTITY" \
            build/mac/*.app

      - name: Verify Codesign
        run: |
          codesign --verify --deep --strict --verbose=2 build/mac/*.app

      - name: Notarize
        run: |
          ditto -c -k --keepParent build/mac/*.app app.zip
          xcrun notarytool submit app.zip \
            --apple-id "$AC_USERNAME" \
            --team-id "$AC_TEAMID" \
            --password "$AC_PASSWORD" \
            --wait

      - name: Staple
        run: |
          xcrun stapler staple build/mac/*.app

      - name: Upload signed macOS app
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: build/mac

  deploy-web:
    name: Deploy Web to GitHub Pages
    runs-on: ubuntu-24.04
    needs: export
    permissions:
      contents: write
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web
          path: build/web

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/web
          clean: true