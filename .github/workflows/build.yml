name: Build Godot project for all platforms

on:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6.2
  EXPORT_NAME: clicks-and-points
  REPO_TO_CLONE: Precontation/clicks-and-points-source
  PROJECT_PATH: source

jobs:
  export:
    name: Export (${{ matrix.platform }})
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.6.2

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            export_preset: Windows Desktop
            artifact_name: Clicks & Points.exe

          - platform: linux
            export_preset: Linux
            artifact_name: Clicks & Points.x86_64

          - platform: web
            export_preset: Web
            artifact_name: index.html

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y fontconfig

      - name: Checkout private source repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_TO_CLONE }}
          token: ${{ secrets.DEPLOY_TOKEN }}
          lfs: true
          path: source
          fetch-depth: 1

      - name: Cache Godot import folder
        uses: actions/cache@v4
        with:
          path: source/.godot/
          key: >-
            v2-${{ runner.os }}-${{ matrix.platform }}-godot-${{
            env.GODOT_VERSION }}-${{
            hashFiles(
              'source/project.godot',
              'source/export_presets.cfg',
              'source/**/*.gd',
              'source/**/*.tres',
              'source/**/*.tscn',
              'source/**/*.import'
            ) }}

      - name: Setup export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -r \
            "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/." \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Prepare web export
        if: matrix.platform == 'web'
        working-directory: source
        run: |
          sed -i '/^DiscordManager=/d' project.godot
          sed -i '/^DiscordRPCLoader=/d' project.godot

      - name: Import project
        working-directory: source
        run: |
          godot --headless --editor --quit

      - name: Build
        run: |
          mkdir -p "build/${{ matrix.platform }}"
          cd "$PROJECT_PATH"

          godot \
            --headless \
            --verbose \
            --export-release \
            "${{ matrix.export_preset }}" \
            "../build/${{ matrix.platform }}/${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: build/${{ matrix.platform }}
          if-no-files-found: error

  export-mac:
    name: Export Mac
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.6.2

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y fontconfig

      - name: Checkout private source repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_TO_CLONE }}
          token: ${{ secrets.DEPLOY_TOKEN }}
          lfs: true
          path: source
          fetch-depth: 1

      - name: Cache Godot import folder
        uses: actions/cache@v4
        with:
          path: source/.godot/
          key: >-
            v2-${{ runner.os }}-mac-godot-${{
            env.GODOT_VERSION }}-${{
            hashFiles(
              'source/project.godot',
              'source/export_presets.cfg',
              'source/**/*.gd',
              'source/**/*.tres',
              'source/**/*.tscn',
              'source/**/*.import'
            ) }}

      - name: Setup export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -r \
            "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/." \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import project
        working-directory: source
        run: |
          godot --headless --editor --quit

      - name: Build Mac
        run: |
          mkdir -p build/mac
          cd "$PROJECT_PATH"

          godot \
            --headless \
            --verbose \
            --export-release \
            "macOS" \
            "../build/mac/Clicks & Points.app"

      - name: Create certificate file
        run: |
          echo '${{ secrets.MACOS_CERT_P12_BASE64 }}' \
            | base64 -d > cert.p12

      - name: Write App Store Connect key
        run: |
          cat > app_store_connect_key.json <<'EOF'
          ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
          EOF

      - name: Sign and notarize
        uses: indygreg/apple-code-sign-action@v1
        with:
          input_path: build/mac/Clicks & Points.app
          notarize: true
          staple: true
          p12_file: cert.p12
          p12_password: ${{ secrets.CERT_PASSWORD }}
          app_store_connect_api_key_json_file: app_store_connect_key.json
          sign_args: --code-signature-flags=runtime

      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: build/mac
          if-no-files-found: error

  deploy-web:
    name: Deploy Web to GitHub Pages
    runs-on: ubuntu-24.04
    needs: export

    permissions:
      contents: write

    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web
          path: build/web

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/web
          clean: true
